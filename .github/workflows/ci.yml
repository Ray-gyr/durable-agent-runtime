name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Static checks, unit/contract and multi-process tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check app test

      - name: Run mypy
        run: python -m mypy app

      - name: Run API, repository contract and buffer tests
        run: python -m pytest -m "not integration and not smoke" -q

      - name: Run multi-process worker integration tests
        run: python -m pytest -m integration -q

  compose_smoke:
    name: Compose deployment smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST_DATA_DIR: ${{ runner.temp }}/runtime-data
      SMOKE_OBJECT_STORE_ROOT: ${{ runner.temp }}/runtime-data/objects
      FASTAPI_BASE_URL: http://127.0.0.1:8080
      BUFFER_WORKER_POLL_SECONDS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Generate a run-scoped debug token
        shell: bash
        run: |
          token="$(openssl rand -hex 24)"
          echo "::add-mask::${token}"
          echo "BUFFER_DEBUG_TOKEN=${token}" >> "$GITHUB_ENV"

      - name: Build and start API and worker
        run: docker compose up --detach --build --wait --wait-timeout 120

      - name: Run smoke tests against the running services
        run: python -m pytest -m smoke -q

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down --volumes
