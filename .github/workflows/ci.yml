name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Static checks, unit/contract and multi-process tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check app test

      - name: Run mypy
        run: python -m mypy app

      - name: Run API, repository contract and buffer tests
        run: python -m pytest -m "not integration and not smoke" -q

      - name: Run multi-process worker integration tests
        run: python -m pytest -m integration -q

  compose_smoke:
    name: Compose deployment smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FASTAPI_BASE_URL: http://127.0.0.1:8080
      BUFFER_WORKER_POLL_SECONDS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.txt

      # The runner context is not available in job-level env, so paths under
      # RUNNER_TEMP are exported at run time.
      - name: Configure data directory and a run-scoped debug token
        shell: bash
        run: |
          echo "HOST_DATA_DIR=${RUNNER_TEMP}/runtime-data" >> "$GITHUB_ENV"
          echo "SMOKE_OBJECT_STORE_ROOT=${RUNNER_TEMP}/runtime-data/objects" >> "$GITHUB_ENV"
          token="$(openssl rand -hex 24)"
          echo "::add-mask::${token}"
          echo "BUFFER_DEBUG_TOKEN=${token}" >> "$GITHUB_ENV"

      - name: Build and start API and worker
        shell: bash
        run: |
          set -o pipefail
          docker version --format 'engine {{.Server.Version}}'
          docker compose version
          docker compose up --detach --build --wait --wait-timeout 120 2>&1 | tee "${RUNNER_TEMP}/compose-up.log"

      - name: Run smoke tests against the running services
        run: python -m pytest -m smoke -q

      # Print full logs, and surface their tail as an annotation so the cause
      # shows on the checks page without opening the raw log.
      - name: Report service state and logs on failure
        if: failure()
        shell: bash
        run: |
          docker compose ps --all || true
          docker compose logs --no-color || true
          {
            echo "== compose up (tail)"; tail -n 30 "${RUNNER_TEMP}/compose-up.log" 2>/dev/null
            echo "== service logs (tail)"; docker compose logs --no-color --tail 30 2>/dev/null
          } > "${RUNNER_TEMP}/failure.txt" || true
          summary="$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' "${RUNNER_TEMP}/failure.txt" | awk '{printf "%s%%0A", $0}')"
          echo "::error title=Compose deployment failed::${summary}"

      - name: Stop services
        if: always()
        run: docker compose down --volumes
